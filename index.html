<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Engine - Observable Universe Sandbox</title>
  <style>
    body { margin: 0; background: #000000; overflow: hidden; font-family: monospace; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .controls {
      position: absolute; top: 20px; left: 20px; background: rgba(0, 0, 0, 0.85);
      border: 1px solid #4a4a4a; padding: 15px; border-radius: 8px; color: #ffffff; z-index: 10;
    }
    .btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    button {
      background: #1a1a1a; border: 1px solid #555; color: #fff; padding: 8px 12px;
      cursor: pointer; border-radius: 4px; font-family: monospace; text-align: left;
    }
    button:hover { border-color: #50b6ff; color: #50b6ff; }
  </style>
</head>
<body>

  <div class="controls">
    <h3>Cosmic Scale Navigator</h3>
    <div class="btn-group">
      <button id="btn-subatomic">🔬 Subatomic Scale (10⁻¹⁵m)</button>
      <button id="btn-macro">🛰️ Anthropogenic Scale (10¹m)</button>
      <button id="btn-celestial">🪐 Planetary Scale (10⁷m)</button>
      <button id="btn-deepspace">🕳️ Deep Space Scale (10¹⁰m)</button>
    </div>
    <div style="margin-top:10px; font-size:11px; color:#aaa;">Exponent: <span id="current-exp" style="color:#50b6ff">7</span></div>
  </div>

  <canvas id="space-viewport"></canvas>

  <!-- Load consolidated layer file directly -->
  <script type="module" src="/src/main.ts"></script>
  
  <script type="module">
    // Wait until Vite maps the core layer onto the window context field
    window.addEventListener('load', () => {
      const canvas = document.getElementById('space-viewport');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const engine = new window.SpaceEngine({
        canvasElement: canvas,
        enableLiveTelemetry: false
      });
      engine.start();

      const currentExpDisplay = document.getElementById('current-exp');
      document.getElementById('btn-subatomic').addEventListener('click', () => { engine.getCamera().zoomTo(-15); currentExpDisplay.innerText = '-15'; });
      document.getElementById('btn-macro').addEventListener('click', () => { engine.getCamera().zoomTo(1); currentExpDisplay.innerText = '1'; });
      document.getElementById('btn-celestial').addEventListener('click', () => { engine.getCamera().zoomTo(7); currentExpDisplay.innerText = '7'; });
      document.getElementById('btn-deepspace').addEventListener('click', () => { engine.getCamera().zoomTo(10); currentExpDisplay.innerText = '10'; });
    });
  </script>
</body>
</html>
