<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Engine - Observable Universe Sandbox</title>
  <style>
    body { margin: 0; background: #020208; overflow: hidden; font-family: 'Courier New', Courier, monospace; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    
    /* Luxury Cyberpunk Sci-Fi UI Controls */
    .controls {
      position: absolute; top: 25px; left: 25px; background: rgba(5, 5, 15, 0.85);
      border: 1px solid #1e3a8a; padding: 20px; border-radius: 12px; color: #ffffff; z-index: 10;
      box-shadow: 0 0 25px rgba(0, 149, 255, 0.2); width: 280px; backdrop-filter: blur(8px);
    }
    h3 { margin: 0 0 14px 0; color: #0095ff; font-size: 16px; border-bottom: 1px solid #1e3a8a; padding-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
    .btn-group { display: flex; flex-direction: column; gap: 10px; }
    button {
      background: rgba(10, 25, 50, 0.6); border: 1px solid #1e3a8a; color: #a3e635; padding: 12px;
      cursor: pointer; border-radius: 6px; font-family: inherit; text-align: left;
      font-size: 12px; font-weight: bold; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    button:hover { background: #0095ff; border-color: #38bdf8; color: #020208; box-shadow: 0 0 15px rgba(0, 149, 255, 0.6); transform: translateX(5px); }
    .status-panel { margin-top: 16px; font-size: 11px; color: #64748b; border-top: 1px solid #1e3a8a; padding-top: 12px; display: flex; flex-direction: column; gap: 4px; }
    .neon-text { color: #38bdf8; font-weight: bold; }
    .success-text { color: #4ade80; font-weight: bold; }
  </style>
</head>
<body>

  <div class="controls">
    <h3>Cosmic Navigator</h3>
    <div class="btn-group">
      <button id="btn-subatomic">🔬 SUBATOMIC SCALE (10⁻¹⁵m)</button>
      <button id="btn-macro">🛰️ ANTHROPOGENIC SCALE (10¹m)</button>
      <button id="btn-celestial">🪐 PLANETARY SCALE (10⁷m)</button>
      <button id="btn-deepspace">🕳️ DEEP SPACE SCALE (10¹⁰m)</button>
    </div>
    <div class="status-panel">
      <div>VIEW EXPONENT: <span id="current-exp" class="neon-text">7</span></div>
      <div>CORE ENGINE: <span class="success-text">ONLINE (60 FPS)</span></div>
    </div>
  </div>

  <canvas id="space-viewport"></canvas>

   <script type="module">
    // -------------------------------------------------------------
    // 🧬 ENHANCED UNIVERSAL DATABASE RECORDS (NASA / JPL DATA)
    // -------------------------------------------------------------
    
    // 1. Subatomic Scale Entities (10⁻¹⁸m to 10⁻¹⁵m)
    const subatomicParticles = [
      { id: "quark_01", name: "Up Quark", scaleExponent: -18, radiusInMeters: 1e-18, visuals: { baseColor: "#ef4444" } },
      { id: "proton_01", name: "Proton", scaleExponent: -15, radiusInMeters: 8.4e-16, visuals: { baseColor: "#22c55e" } }
    ];

    // 2. Anthropogenic & Planetary Scale Entities (10¹m to 10⁷m)
    const solarSystemBodies = [
      // Central Star
      {
        id: "sun_01",
        name: "The Sun (Sol)",
        scaleExponent: 9,
        radiusInMeters: 696340000,
        visuals: { baseColor: "#f59e0b" } // Intense Cosmic Yellow
      },
      // Inner Planets
      {
        id: "mercury_01",
        name: "Mercury",
        scaleExponent: 6,
        radiusInMeters: 2439700,
        orbitAroundId: "sun_01",
        orbitalElements: { semiMajorAxis: 0.387, eccentricity: 0.2056, orbitalPeriodInDays: 87.97 },
        visuals: { baseColor: "#94a3b8" }
      },
      {
        id: "venus_01",
        name: "Venus",
        scaleExponent: 7,
        radiusInMeters: 6051800,
        orbitAroundId: "sun_01",
        orbitalElements: { semiMajorAxis: 0.723, eccentricity: 0.0067, orbitalPeriodInDays: 224.7 },
        visuals: { baseColor: "#f59e0b" }
      },
      {
        id: "earth_01",
        name: "Earth",
        scaleExponent: 7,
        radiusInMeters: 6371000,
        orbitAroundId: "sun_01",
        orbitalElements: { semiMajorAxis: 1.0, eccentricity: 0.0167, orbitalPeriodInDays: 365.25 },
        visuals: { baseColor: "#3b82f6" }
      },
      {
        id: "moon_01",
        name: "The Moon (Luna)",
        scaleExponent: 6,
        radiusInMeters: 1737400,
        orbitAroundId: "earth_01",
        orbitalElements: { semiMajorAxis: 0.00257, eccentricity: 0.0549, orbitalPeriodInDays: 27.32 },
        visuals: { baseColor: "#cbd5e1" }
      },
      {
        id: "mars_01",
        name: "Mars",
        scaleExponent: 6,
        radiusInMeters: 3389500,
        orbitAroundId: "sun_01",
        orbitalElements: { semiMajorAxis: 1.524, eccentricity: 0.0934, orbitalPeriodInDays: 686.98 },
        visuals: { baseColor: "#ef4444" }
      },
      // Outer Gas Giants
      {
        id: "jupiter_01",
        name: "Jupiter",
        scaleExponent: 8,
        radiusInMeters: 69911000,
        orbitAroundId: "sun_01",
        orbitalElements: { semiMajorAxis: 5.203, eccentricity: 0.0489, orbitalPeriodInDays: 4332.59 },
        visuals: { baseColor: "#f97316" }
      },
      {
        id: "saturn_01",
        name: "Saturn",
        scaleExponent: 8,
        radiusInMeters: 58232000,
        orbitAroundId: "sun_01",
        orbitalElements: { semiMajorAxis: 9.537, eccentricity: 0.0541, orbitalPeriodInDays: 10759.22 },
        visuals: { baseColor: "#fef08a", hasRings: true }
      },
      // Anthropogenic Spacecraft Explorers
      {
        id: "jwst_01",
        name: "James Webb Space Telescope",
        scaleExponent: 1,
        radiusInMeters: 22,
        orbitAroundId: "earth_01",
        orbitalElements: { semiMajorAxis: 0.01, eccentricity: 0.01, orbitalPeriodInDays: 365.25 },
        visuals: { baseColor: "#eab308" }
      },
      {
        id: "voyager_01",
        name: "Voyager 1",
        scaleExponent: 0,
        radiusInMeters: 4,
        orbitAroundId: "sun_01",
        orbitalElements: { semiMajorAxis: 163.0, eccentricity: 1.0, orbitalPeriodInDays: 999999 },
        visuals: { baseColor: "#ec4899" }
      }
    ];

    // 3. Deep Space & Cosmic Scale Entities (10¹⁰m to 10²²m)
    const deepSpaceEntities = [
      { id: "blackhole_01", name: "Sagittarius A*", scaleExponent: 10, radiusInMeters: 1.2e10, visuals: { baseColor: "#eab308" } },
      { id: "andromeda_01", name: "Andromeda Galaxy (M31)", scaleExponent: 21, radiusInMeters: 1.04e21, visuals: { baseColor: "#a855f7" } }
    ];
         // -------------------------------------------------------------
    // 🧮 ASTROPHYSICS & CORE SIMULATION LOGIC
    // -------------------------------------------------------------
    
    class KeplerianSolver {
      static computeOrbitalPosition(body, timeInSeconds) {
        const a = body.orbitalElements.semiMajorAxis * 1.496e11;
        const e = body.orbitalElements.eccentricity;
        const periodInSeconds = body.orbitalElements.orbitalPeriodInDays * 86400;
        const meanAnomaly = ((2 * Math.PI / periodInSeconds) * timeInSeconds) % (2 * Math.PI);

        let eccentricAnomaly = meanAnomaly;
        for (let i = 0; i < 5; i++) {
          eccentricAnomaly -= (eccentricAnomaly - e * Math.sin(eccentricAnomaly) - meanAnomaly) / (1 - e * Math.cos(eccentricAnomaly));
        }

        return {
          x: a * (Math.cos(eccentricAnomaly) - e),
          y: a * Math.sqrt(1 - e * e) * Math.sin(eccentricAnomaly)
        };
      }
    }

    class LogarithmicCamera {
      constructor(initialExponent = 7) {
        this.currentExponent = initialExponent;
        this.targetExponent = initialExponent;
        this.lerpFactor = 0.08;
      }
      zoomTo(exponent) { this.targetExponent = exponent; }
      update() { this.currentExponent += (this.targetExponent - this.currentExponent) * this.lerpFactor; }
      calculatePixelSize(realRadiusInMeters, objectExponent, screenWidth) {
        const viewRangeMeters = Math.pow(10, this.currentExponent);
        const calculatedSize = (realRadiusInMeters / viewRangeMeters) * (screenWidth / 4);
        
        const diff = Math.abs(this.currentExponent - objectExponent);
        if (diff > 4) return 0;
        
        return Math.min(calculatedSize, screenWidth * 0.15);
      }
    }

    class StarField {
      constructor(canvas, maxStars = 500) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.stars = Array.from({ length: maxStars }, () => ({
          x: (Math.random() - 0.5) * window.innerWidth * 2,
          y: (Math.random() - 0.5) * window.innerHeight * 2,
          z: Math.random() * window.innerWidth,
          brightness: Math.random()
        }));
      }
      render(speed = 0.3) {
        const w = this.canvas.width;
        const h = this.canvas.height;
        this.ctx.fillStyle = '#010206';
        this.ctx.fillRect(0, 0, w, h);

        for (const star of this.stars) {
          star.z -= speed;
          if (star.z <= 0) star.z = w;
          const k = 128.0 / star.z;
          const px = star.x * k + w / 2;
          const py = star.y * k + h / 2;
          if (px >= 0 && px <= w && py >= 0 && py <= h) {
            const size = (1 - star.z / w) * 1.8;
            this.ctx.fillStyle = `rgba(255, 255, 255, ${star.brightness * 0.8})`;
            this.ctx.fillRect(px, py, size, size);
          }
        }
      }
    }

    class SpaceEngine {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.camera = new LogarithmicCamera(7);
        this.starField = new StarField(canvas, 500);
        this.isRunning = false;
      }
      
      start() { 
        this.isRunning = true; 
        this.loop(0); 
      }
      
      getCamera() { return this.camera; }
      
      loop(elapsedTimeInSeconds) {
        if (!this.isRunning) return;

        this.starField.render(0.4);

        const allEntities = [...subatomicParticles, ...solarSystemBodies, ...deepSpaceEntities];

        for (const body of allEntities) {
          let screenX = this.canvas.width / 2;
          let screenY = this.canvas.height / 2;

          if (body.orbitalElements) {
            const position = KeplerianSolver.computeOrbitalPosition(body, elapsedTimeInSeconds);
            const distanceScale = body.orbitAroundId === "earth_01" ? 15000 : 45; 
            screenX += (position.x / 1.496e11) * distanceScale;
            screenY += (position.y / 1.496e11) * distanceScale;
          }

          const pixelSize = this.camera.calculatePixelSize(body.radiusInMeters, body.scaleExponent, this.canvas.width);
          
          if (pixelSize > 0) {
            const finalRenderSize = Math.max(22, pixelSize);

            this.ctx.save();

            // 1. Outer Glow Aura (10% opacity)
            this.ctx.globalAlpha = 0.10;
            this.ctx.beginPath();
            this.ctx.arc(screenX, screenY, finalRenderSize * 1.8, 0, Math.PI * 2);
            this.ctx.fillStyle = body.visuals.baseColor;
            this.ctx.fill();

            // 2. Inner Glow Aura (30% opacity)
            this.ctx.globalAlpha = 0.30;
            this.ctx.beginPath();
            this.ctx.arc(screenX, screenY, finalRenderSize * 1.4, 0, Math.PI * 2);
            this.ctx.fillStyle = body.visuals.baseColor;
            this.ctx.fill();

            // 3. Solid Core Body (100% opacity)
            this.ctx.globalAlpha = 1.0;
            this.ctx.beginPath();
            this.ctx.arc(screenX, screenY, finalRenderSize, 0, Math.PI * 2);
            this.ctx.fillStyle = body.visuals.baseColor;
            this.ctx.fill();

            // Special Asset Rendering: Saturn's Planetary Rings Structure
            if (body.visuals.hasRings) {
              this.ctx.globalAlpha = 0.5;
              this.ctx.strokeStyle = "#e2e8f0";
              this.ctx.lineWidth = finalRenderSize * 0.4;
              this.ctx.beginPath();
              this.ctx.ellipse(screenX, screenY, finalRenderSize * 1.7, finalRenderSize * 0.6, Math.PI / 6, 0, Math.PI * 2);
              this.ctx.stroke();
            }

            this.ctx.restore();

            // Cyberpunk vector typography text labeling
            this.ctx.fillStyle = '#ffffff';
            this.ctx.font = 'bold 12px "Courier New", monospace';
            this.ctx.shadowColor = '#000000';
            this.ctx.shadowBlur = 4;
            this.ctx.fillText(`> ${body.name.toUpperCase()}`, screenX + finalRenderSize + 14, screenY + 4);
            this.ctx.shadowBlur = 0;
          }
        }

        this.camera.update();
        requestAnimationFrame(() => this.loop(elapsedTimeInSeconds + 12000));
      }
    }

    // -------------------------------------------------------------
    // 🕹️ INTERACTIVE MOUNT INITIALIZATION RUNTIME
    // -------------------------------------------------------------
    const canvas = document.getElementById('space-viewport');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const engine = new SpaceEngine(canvas);
    engine.start();

    const currentExpDisplay = document.getElementById('current-exp');
    
    document.getElementById('btn-subatomic').addEventListener('click', () => { engine.getCamera().zoomTo(-15); currentExpDisplay.innerText = '-15'; });
    document.getElementById('btn-macro').addEventListener('click', () => { engine.getCamera().zoomTo(1); currentExpDisplay.innerText = '1'; });
    document.getElementById('btn-celestial').addEventListener('click', () => { engine.getCamera().zoomTo(7); currentExpDisplay.innerText = '7'; });
    document.getElementById('btn-deepspace').addEventListener('click', () => { engine.getCamera().zoomTo(10); currentExpDisplay.innerText = '10'; });

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
