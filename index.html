<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Engine - Observable Universe Sandbox</title>
  <style>
    body { margin: 0; background: #020208; overflow: hidden; font-family: 'Courier New', Courier, monospace; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    
    /* Advanced Cyberpunk Sci-Fi UI Controls with Animation */
    .controls {
      position: absolute; top: 25px; left: 25px; background: rgba(5, 5, 15, 0.9);
      border: 1px solid #1e3a8a; padding: 20px; border-radius: 12px; color: #ffffff; z-index: 10;
      box-shadow: 0 0 25px rgba(0, 149, 255, 0.25); width: 280px; backdrop-filter: blur(8px);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      transform: translateX(0);
      opacity: 1;
    }
    
    /* Toggle state utilities */
    .controls.hidden {
      transform: translateX(-340px);
      opacity: 0;
      pointer-events: none;
    }
    
    /* Futuristic Floating Trigger Button */
    .toggle-trigger {
      position: absolute; top: 25px; left: 25px; background: rgba(10, 25, 50, 0.8);
      border: 1px solid #0095ff; color: #0095ff; padding: 12px 16px; border-radius: 8px;
      cursor: pointer; z-index: 9; font-family: inherit; font-size: 12px; font-weight: bold;
      box-shadow: 0 0 15px rgba(0, 149, 255, 0.2);
      transition: all 0.2s ease-in-out;
    }
    .toggle-trigger:hover { background: #0095ff; color: #020208; box-shadow: 0 0 20px rgba(0, 149, 255, 0.6); }

    /* Inside panel close trigger */
    .close-panel-btn {
      float: right; background: none; border: none; color: #ef4444; cursor: pointer;
      font-family: inherit; font-size: 14px; font-weight: bold; padding: 0; margin-top: -2px;
    }
    .close-panel-btn:hover { color: #f87171; text-shadow: 0 0 8px #ef4444; }

    h3 { margin: 0 0 14px 0; color: #0095ff; font-size: 16px; border-bottom: 1px solid #1e3a8a; padding-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
    .btn-group { display: flex; flex-direction: column; gap: 10px; }
    button.nav-btn {
      background: rgba(10, 25, 50, 0.6); border: 1px solid #1e3a8a; color: #a3e635; padding: 12px;
      cursor: pointer; border-radius: 6px; font-family: inherit; text-align: left;
      font-size: 12px; font-weight: bold; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    button.nav-btn:hover { background: #0095ff; border-color: #38bdf8; color: #020208; box-shadow: 0 0 15px rgba(0, 149, 255, 0.6); transform: translateX(5px); }
    .status-panel { margin-top: 16px; font-size: 11px; color: #64748b; border-top: 1px solid #1e3a8a; padding-top: 12px; display: flex; flex-direction: column; gap: 4px; }
    .neon-text { color: #38bdf8; font-weight: bold; }
    .success-text { color: #4ade80; font-weight: bold; }
  </style>
</head>
<body>

  <!-- Floating Menu Trigger (Only visible when panel is closed) -->
  <button id="btn-toggle-menu" class="toggle-trigger">> OPEN MENU</button>

  <!-- Main HUD Panel -->
  <div id="hud-panel" class="controls">
    <button id="btn-close-hud" class="close-panel-btn">[X]</button>
    <h3>Cosmic Navigator</h3>
    <div class="btn-group">
      <button id="btn-subatomic" class="nav-btn">🔬 SUBATOMIC SCALE (10⁻¹⁵m)</button>
      <button id="btn-macro" class="nav-btn">🛰️ ANTHROPOGENIC SCALE (10¹m)</button>
      <button id="btn-celestial" class="nav-btn">🪐 PLANETARY SCALE (10⁷m)</button>
      <button id="btn-deepspace" class="nav-btn">🕳️ DEEP SPACE SCALE (10¹⁰m)</button>
    </div>
    <div class="status-panel">
      <div>VIEW EXPONENT: <span id="current-exp" class="neon-text">7</span></div>
      <div>CORE ENGINE: <span class="success-text">ONLINE (60 FPS)</span></div>
    </div>
  </div>


    <canvas id="space-viewport"></canvas>

    <script type="module">    
    // -------------------------------------------------------------
    // 🧬 ENHANCED UNIVERSAL DATABASE RECORDS (NASA / JPL DATA)
    // -------------------------------------------------------------
    
    const subatomicParticles = [
      { id: "quark_01", name: "Up Quark", scaleExponent: -18, radiusInMeters: 1e-18, visuals: { baseColor: "#ef4444" } },
      { id: "proton_01", name: "Proton", scaleExponent: -15, radiusInMeters: 8.4e-16, visuals: { baseColor: "#22c55e" } }
    ];

    const solarSystemBodies = [
      { id: "sun_01", name: "The Sun", scaleExponent: 9, radiusInMeters: 696340000, visuals: { baseColor: "#f59e0b" } },
      { id: "mercury_01", name: "Mercury", scaleExponent: 6, radiusInMeters: 2439700, orbitalElements: { orbitalPeriodInDays: 87.97 }, visuals: { baseColor: "#94a3b8" } },
      { id: "venus_01", name: "Venus", scaleExponent: 7, radiusInMeters: 6051800, orbitalElements: { orbitalPeriodInDays: 224.7 }, visuals: { baseColor: "#fb923c" } },
      { id: "earth_01", name: "Earth", scaleExponent: 7, radiusInMeters: 6371000, orbitalElements: { orbitalPeriodInDays: 365.25 }, visuals: { baseColor: "#3b82f6" } },
      { id: "moon_01", name: "The Moon", scaleExponent: 6, radiusInMeters: 1737400, orbitalElements: { orbitalPeriodInDays: 27.32 }, visuals: { baseColor: "#cbd5e1" } },
      { id: "mars_01", name: "Mars", scaleExponent: 6, radiusInMeters: 3389500, orbitalElements: { orbitalPeriodInDays: 686.98 }, visuals: { baseColor: "#ef4444" } },
      { id: "jupiter_01", name: "Jupiter", scaleExponent: 8, radiusInMeters: 69911000, orbitalElements: { orbitalPeriodInDays: 4332.59 }, visuals: { baseColor: "#f97316" } },
      { id: "saturn_01", name: "Saturn", scaleExponent: 8, radiusInMeters: 58232000, orbitalElements: { orbitalPeriodInDays: 10759.22 }, visuals: { baseColor: "#fef08a", hasRings: true } },
      { id: "jwst_01", name: "JWST Spacecraft", scaleExponent: 1, radiusInMeters: 22, orbitalElements: { orbitalPeriodInDays: 365.25 }, visuals: { baseColor: "#eab308" } },
      { id: "voyager_01", name: "Voyager 1", scaleExponent: 0, radiusInMeters: 4, orbitalElements: { orbitalPeriodInDays: 99999 }, visuals: { baseColor: "#ec4899" } }
    ];

    const deepSpaceEntities = [
      { id: "blackhole_01", name: "Sagittarius A*", scaleExponent: 10, radiusInMeters: 1.2e10, visuals: { baseColor: "#eab308" } },
      { id: "andromeda_01", name: "Andromeda (M31)", scaleExponent: 21, radiusInMeters: 1.04e21, visuals: { baseColor: "#a855f7" } }
    ];

    // 🕹️ INTERACTIVE HUD TOGGLE MECHANICS
    const hudPanel = document.getElementById('hud-panel');
    const toggleMenuBtn = document.getElementById('btn-toggle-menu');
    const closeHudBtn = document.getElementById('btn-close-hud');

    // Close HUD action (slides left out of view)
    closeHudBtn.addEventListener('click', () => {
      hudPanel.classList.add('hidden');
    });

    // Open HUD action (slides back into view)
    toggleMenuBtn.addEventListener('click', () => {
      hudPanel.classList.remove('hidden');
    });
 
    // -------------------------------------------------------------
    // 🧮 ASTROPHYSICS & CORE SIMULATION LOGIC
    // -------------------------------------------------------------
    
    class LogarithmicCamera {
      constructor(initialExponent = 7) {
        this.currentExponent = initialExponent;
        this.targetExponent = initialExponent;
        this.lerpFactor = 0.08;
      }
      zoomTo(exponent) { this.targetExponent = exponent; }
      update() { this.currentExponent += (this.targetExponent - this.currentExponent) * this.lerpFactor; }
      calculatePixelSize(realRadiusInMeters, screenWidth) {
        const viewRangeMeters = Math.pow(10, this.currentExponent);
        return (realRadiusInMeters / viewRangeMeters) * (screenWidth / 6);
      }
    }

    class StarField {
      constructor(canvas, maxStars = 400) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.stars = Array.from({ length: maxStars }, function() {
          return {
            x: (Math.random() - 0.5) * window.innerWidth * 2,
            y: (Math.random() - 0.5) * window.innerHeight * 2,
            z: Math.random() * window.innerWidth,
            brightness: Math.random()
          };
        });
      }
      render(speed = 0.3) {
        const w = this.canvas.width;
        const h = this.canvas.height;
        this.ctx.fillStyle = '#010206';
        this.ctx.fillRect(0, 0, w, h);

        for (const star of this.stars) {
          star.z -= speed;
          if (star.z <= 0) star.z = w;
          const k = 128.0 / star.z;
          const px = star.x * k + w / 2;
          const py = star.y * k + h / 2;
          if (px >= 0 && px <= w && py >= 0 && py <= h) {
            const size = (1 - star.z / w) * 1.5;
            this.ctx.fillStyle = "rgba(255, 255, 255, " + (star.brightness * 0.7) + ")";
            this.ctx.fillRect(px, py, size, size);
          }
        }
      }
    }

    class SpaceEngine {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.camera = new LogarithmicCamera(7);
        this.starField = new StarField(canvas, 400);
        this.isRunning = false;
      }
      
      start() { 
        this.isRunning = true; 
        this.loop(0); 
      }
      
      getCamera() { return this.camera; }
      
      loop(elapsedTimeInSeconds) {
        if (!this.isRunning) return;

        this.starField.render(0.2);

        const currentExp = Math.round(this.camera.targetExponent);
        let activeEntities = [];

        // FIXED: Replaced array arrow tokens with traditional robust function mapping loops
        if (currentExp === -15) {
          activeEntities = subatomicParticles;
        } else if (currentExp === 1) {
          activeEntities = solarSystemBodies.filter(function(element) {
            return element.scaleExponent <= 4;
          });
        } else if (currentExp === 7) {
          activeEntities = solarSystemBodies;
        } else if (currentExp === 10) {
          activeEntities = deepSpaceEntities;
        }

        const count = activeEntities.length;
        const cols = count > 4 ? 4 : count;
        const rows = Math.ceil(count / cols);
        
        const cellWidth = this.canvas.width / cols;
        const cellHeight = this.canvas.height / rows;

        activeEntities.forEach((body, index) => {
          const col = index % cols;
          const row = Math.floor(index / cols);
          
          const centerX = col * cellWidth + cellWidth / 2;
          const centerY = row * cellHeight + cellHeight / 2;

          this.ctx.strokeStyle = 'rgba(30, 58, 138, 0.2)';
          this.ctx.lineWidth = 1;
          this.ctx.strokeRect(col * cellWidth + 10, row * cellHeight + 10, cellWidth - 20, cellHeight - 20);

          let offsetBoundsX = 0;
          let offsetBoundsY = 0;

          if (body.orbitalElements) {
            const angle = ((2 * Math.PI / body.orbitalElements.orbitalPeriodInDays) * (elapsedTimeInSeconds * 0.001)) % (2 * Math.PI);
            offsetBoundsX = Math.cos(angle) * (Math.min(cellWidth, cellHeight) * 0.22);
            offsetBoundsY = Math.sin(angle) * (Math.min(cellWidth, cellHeight) * 0.22);

            this.ctx.beginPath();
            this.ctx.arc(centerX, centerY, Math.min(cellWidth, cellHeight) * 0.22, 0, Math.PI * 2);
            this.ctx.strokeStyle = 'rgba(56, 189, 248, 0.08)';
            this.ctx.stroke();
          }

          const targetX = centerX + offsetBoundsX;
          const targetY = centerY + offsetBoundsY;

          const pixelSize = this.camera.calculatePixelSize(body.radiusInMeters, this.canvas.width);
          const finalRenderSize = Math.max(16, Math.min(pixelSize, Math.min(cellWidth, cellHeight) * 0.12));

          this.ctx.save();

          this.ctx.globalAlpha = 0.08;
          this.ctx.beginPath();
          this.ctx.arc(targetX, targetY, finalRenderSize * 1.8, 0, Math.PI * 2);
          this.ctx.fillStyle = body.visuals.baseColor;
          this.ctx.fill();

          this.ctx.globalAlpha = 0.25;
          this.ctx.beginPath();
          this.ctx.arc(targetX, targetY, finalRenderSize * 1.3, 0, Math.PI * 2);
          this.ctx.fillStyle = body.visuals.baseColor;
          this.ctx.fill();

          this.ctx.globalAlpha = 1.0;
          this.ctx.beginPath();
          this.ctx.arc(targetX, targetY, finalRenderSize, 0, Math.PI * 2);
          this.ctx.fillStyle = body.visuals.baseColor;
          this.ctx.fill();

          if (body.visuals.hasRings) {
            this.ctx.globalAlpha = 0.4;
            this.ctx.strokeStyle = "#cbd5e1";
            this.ctx.lineWidth = finalRenderSize * 0.3;
            this.ctx.beginPath();
            this.ctx.ellipse(targetX, targetY, finalRenderSize * 1.6, finalRenderSize * 0.5, Math.PI / 6, 0, Math.PI * 2);
            this.ctx.stroke();
          }

          this.ctx.restore();

          this.ctx.fillStyle = '#ffffff';
          this.ctx.font = 'bold 11px "Courier New", monospace';
          this.ctx.fillText(`> ${body.name.toUpperCase()}`, col * cellWidth + 25, row * cellHeight + 35);
        });

        this.camera.update();
        requestAnimationFrame(() => this.loop(elapsedTimeInSeconds + 16));
      }
    }

    // -------------------------------------------------------------
    // 🕹️ INTERACTIVE MOUNT INITIALIZATION RUNTIME
    // -------------------------------------------------------------
    const canvas = document.getElementById('space-viewport');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const engine = new SpaceEngine(canvas);
    engine.start();

    const currentExpDisplay = document.getElementById('current-exp');
    
    document.getElementById('btn-subatomic').addEventListener('click', () => { engine.getCamera().zoomTo(-15); currentExpDisplay.innerText = '-15'; });
    document.getElementById('btn-macro').addEventListener('click', () => { engine.getCamera().zoomTo(1); currentExpDisplay.innerText = '1'; });
    document.getElementById('btn-celestial').addEventListener('click', () => { engine.getCamera().zoomTo(7); currentExpDisplay.innerText = '7'; });
    document.getElementById('btn-deepspace').addEventListener('click', () => { engine.getCamera().zoomTo(10); currentExpDisplay.innerText = '10'; });

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
